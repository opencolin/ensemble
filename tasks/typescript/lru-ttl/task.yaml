id: ts-lru-ttl
language: typescript
category: feature
maxTurns: 30
prompt: |
  Implement an LRU (least-recently-used) cache with optional per-entry TTL in
  `lru.mjs`. Use ES module syntax (the file is `.mjs`) and `export` the class
  `LRUCache`.

  ## Constructor

  `new LRUCache(capacity, options = {})`
  - `capacity` is an integer >= 1 (the maximum number of LIVE entries).
  - `options.now` is an OPTIONAL function returning the current time in
    milliseconds. It defaults to `Date.now`. The class MUST call this function
    every time it needs the current time and MUST NOT cache the value — tests
    inject a fake clock and advance it between calls.

  ## Time and expiry model

  An entry inserted at time `t` with a TTL of `d` milliseconds is EXPIRED once
  `now() >= t + d`. That is, expiry is inclusive of the boundary: exactly at
  `t + d` the entry is already expired. An entry with no TTL never expires.

  Expired entries must be treated as if they are not present. Purge them lazily
  (when an operation needs to know whether a key is live, or needs to free
  capacity) — there is no requirement to purge eagerly on a timer.

  ## Methods

  - `set(key, value, ttlMs)`: insert a new entry or update an existing one.
    - Updating an existing key replaces its value AND marks it most-recently-used.
    - If `ttlMs` is provided, it (re)sets the expiry relative to the current
      `now()` (so updating a key with a new `ttlMs` resets its lifetime).
    - If `ttlMs` is omitted (`undefined`), the entry never expires. When updating
      an existing key WITHOUT a `ttlMs`, any previous TTL is cleared and the
      entry becomes non-expiring.
    - Inserting a brand-new key when the cache is already full evicts entries to
      make room (see Eviction below).
    - `set` returns the cache instance (so calls can be chained), but tests do
      not depend on the return value of `set` except where stated.
  - `get(key)`: returns the value, or `undefined` if the key is absent or
    expired. A successful `get` marks the key most-recently-used. If the key is
    expired, it is removed and treated as absent (returns `undefined`).
  - `peek(key)`: returns the value, or `undefined` if absent or expired. Honors
    expiry exactly like `get`, but does NOT change recency. (It may still remove
    an entry it observes to be expired.)
  - `has(key)`: returns a boolean — `true` iff the key is present and live.
    Honors expiry. Does NOT change recency.
  - `delete(key)`: returns `true` if the key was present AND live at the time of
    the call, otherwise `false`. In all cases the key is not present afterward.
    Deleting an expired or absent key returns `false`.
  - `ttl(key)`: returns the number of milliseconds remaining until the entry
    expires, as `max(0, expiresAt - now())`, computed at call time. Returns
    `undefined` if the key is absent, expired, or has no TTL. Specifically: if
    the entry is live and has a finite TTL, return the remaining ms (which is
    `> 0` strictly before expiry); if the entry is live but has no TTL, return
    `undefined`; if the entry is absent or expired, return `undefined`. `ttl`
    does NOT change recency.
  - `get size()`: a getter returning the number of LIVE (non-expired) entries.
    Expired entries are not counted (and may be purged as a side effect of
    reading `size`).

  ## Eviction

  When inserting a BRAND-NEW key (not an update of an existing live key) would
  exceed `capacity`:
  1. First purge any expired entries. Expired entries free capacity, so if
     purging expired entries makes room, NO live entry is evicted.
  2. If still at capacity after purging, evict the least-recently-used LIVE
     entry, repeating until there is room for the new key.

  An expired entry must never be the reason a live entry is evicted: always
  reclaim expired space before evicting anything live.

  Recency rules (most-recently-used wins, least-recently-used is evicted first):
  - `set` of a new key makes that key most-recently-used.
  - `set` updating an existing key makes it most-recently-used.
  - A successful `get` makes the key most-recently-used.
  - `peek`, `has`, `ttl`, and `delete` do NOT change recency.

  Keys may be strings or numbers.

  Implement `lru.mjs` to this specification. It is graded against a hidden test
  suite you never see, so handle every rule and edge case described above.
acceptance: 'node --test'
hiddenTests:
  - test.mjs
