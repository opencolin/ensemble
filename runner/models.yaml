# Models to benchmark for the Ensemble-runs source, plus runner settings.
# Real Nebius Token Factory ids (case-sensitive). `name` matches the scraped
# leaderboard so results merge with model profiles and fill the gap cells.

settings:
  runsPerTask: 1            # reruns per task (1 = fast first pass; raise later)
  maxTurns: 25             # default agent max turns (task.yaml may override)
  proxyBasePort: 8083      # claude-code-proxy: model i listens on proxyBasePort + i
  nebiusBaseUrl: https://api.studio.nebius.com/v1
  servedBy: Nebius Token Factory
  agentTimeoutSec: 360     # per-attempt wall-clock cap (seconds)

models:
